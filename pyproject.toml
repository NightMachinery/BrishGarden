[tool.poetry]
name = "brishgarden"
version = "0.3.0"
description = "BrishGarden uses Brish to serve an HTTP API that can execute interpreted code (that would otherwise need expensive startup costs) fast. It's also useful as a remote code executor."
authors = ["NightMachinary <rudiwillalwaysloveyou@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
#: FastAPI 0.133 (the first to allow Starlette 1.x) and the patched
#: Starlette and python-multipart releases below all need Python 3.10.
python = ">=3.10,<4.0"
#: The floors of python-multipart, starlette and pydantic-settings are the
#: first releases without a known advisory. Starlette is not imported
#: directly, but it is the HTTP layer under FastAPI, which allows older ones.
python-multipart = ">=0.0.31"
# brish = {git = "https://github.com/NightMachinery/brish.git"}
fastapi = {extras = ["all"], version = ">=0.133.0"}
starlette = ">=1.3.1"
#: uvicorn 0.47 imports the app before it starts the event loop, and
#: garden.py needs a running loop at import (`async_max_workers_set`).
uvicorn = {extras = ["standard"], version = ">=0.23.2,<0.47"}
pydantic-settings = "^2.14.2"
brish = "*"
pynight = "*"

[tool.poetry.scripts]
brishgarden = 'brishgarden:main'

[build-system]
requires = [  "setuptools", "poetry_core>=1.0"]
build-backend = "poetry.core.masonry.api"
